name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src/bootstrap_doctor

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build pip-audit
          python -m build

      - name: Validate built wheel
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="$(realpath "${wheels[0]}")"
          audit_python="$(python -c 'import sys; print(sys.executable)')"
          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          python -m venv "$validation_dir/venv"
          (
            cd "$validation_dir"
            unset PYTHONPATH PYTHONHOME
            ./venv/bin/python -m pip install "$wheel"
            ./venv/bin/python -m pip check
            ./venv/bin/bootstrap-doctor --version
            ./venv/bin/bootstrap-doctor --help
            # Audit the exact installed runtime dependencies, excluding the local wheel itself.
            ./venv/bin/python -m pip freeze --exclude bootstrap-doctor > requirements.txt
            "$audit_python" -m pip_audit --strict --disable-pip --no-deps -r requirements.txt
          )

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: validated-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: validated-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
